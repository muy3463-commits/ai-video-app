<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Extender</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0b0f19; color: #e2e8f0; padding: 16px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; background: #151c2c; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { font-size: 1.3rem; text-align: center; color: #38bdf8; margin-bottom: 20px; }
        .card { background: #1e293b; padding: 16px; border-radius: 12px; margin-bottom: 16px; border: 1px solid #334155; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; font-weight: 600; margin-bottom: 8px; }
        input[type="file"], textarea, select, input[type="password"] { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 0.9rem; margin-bottom: 12px; }
        textarea { height: 80px; resize: none; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #2563eb, #0284c7); border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .btn:active { opacity: 0.8; }
        #previewImg { width: 100%; max-height: 200px; border-radius: 8px; object-fit: cover; display: none; margin-bottom: 12px; }
        #videoPlayer { width: 100%; border-radius: 8px; margin-top: 12px; display: none; }
        .status { font-size: 0.85rem; color: #38bdf8; text-align: center; margin-top: 8px; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>🎬 AI Image-to-Video Extender</h1>

    <div class="card">
        <label>🔑 HuggingFace API Key (Gratis)</label>
        <input type="password" id="apiKey" placeholder="Masukkan API Key hf_..." onchange="saveKey()">
    </div>

    <div class="card">
        <label>🖼️ 1. Unggah Gambar</label>
        <input type="file" id="imageInput" accept="image/*" onchange="previewFile()">
        <img id="previewImg" alt="Preview">

        <label>✍️ 2. Prompt Instruksi Gerakan</label>
        <textarea id="promptInput" placeholder="Contoh: Kamera bergerak perlahan mendekati objek, efek sinematik..."></textarea>

        <label>⏱️ 3. Durasi Target</label>
        <select id="durationSelect">
            <option value="5">5 Detik (Awal)</option>
            <option value="10">10 Detik (Extend +5s)</option>
            <option value="15">15 Detik (Extend +10s)</option>
        </select>

        <button class="btn" onclick="generateAI()">✨ Generate Video</button>
    </div>

    <div class="card">
        <label>📺 Hasil Video AI</label>
        <div id="status" class="status">Siap memproses.</div>
        <video id="videoPlayer" controls loop autoplay muted></video>
    </div>
</div>

<script>
    document.getElementById('apiKey').value = localStorage.getItem('hf_api_key') || '';

    function saveKey() {
        const key = document.getElementById('apiKey').value;
        localStorage.setItem('hf_api_key', key);
    }

    function previewFile() {
        const file = document.getElementById('imageInput').files[0];
        const preview = document.getElementById('previewImg');
        if (file) {
            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';
        }
    }

    async function generateAI() {
        const key = localStorage.getItem('hf_api_key');
        const file = document.getElementById('imageInput').files[0];
        const prompt = document.getElementById('promptInput').value;
        const duration = document.getElementById('durationSelect').value;
        const status = document.getElementById('status');
        const player = document.getElementById('videoPlayer');

        if (!file) { alert('Silakan pilih gambar terlebih dahulu!'); return; }
        if (!prompt) { alert('Silakan isi prompt!'); return; }

        status.innerText = `Sedang memproses & memperpanjang ke ${duration} detik...`;
        player.style.display = 'none';

        if (!key) {
            setTimeout(() => {
                status.innerText = `[Mode Demo] Selesai! Menggunakan sampel video demo (${duration} detik).`;
                player.src = "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4";
                player.style.display = 'block';
            }, 2500);
            return;
        }

        try {
            const formData = new FormData();
            formData.append('inputs', file);
            formData.append('prompt', prompt);

            const response = await fetch("https://api-inference.huggingface.co/models/stabilityai/stable-video-diffusion-img2vid", {
                headers: { Authorization: `Bearer ${key}` },
                method: "POST",
                body: file
            });

            if (!response.ok) throw new Error("Gagal memproses di server AI.");

            const blob = await response.blob();
            player.src = URL.createObjectURL(blob);
            player.style.display = 'block';
            status.innerText = `Video ${duration} detik berhasil dibuat!`;
        } catch (err) {
            status.innerText = "Terjadi kesalahan: " + err.message;
        }
    }
</script>

</body>
</html>
